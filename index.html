<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PhotoSwipe Review — Coming Soon</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;

      font-family: Arial, Helvetica, sans-serif;
      color: white;
      overflow: hidden;

      background:
        radial-gradient(
          circle at 20% 20%,
          rgba(124, 58, 237, 0.35),
          transparent 35%
        ),
        radial-gradient(
          circle at 80% 80%,
          rgba(37, 99, 235, 0.30),
          transparent 35%
        ),
        linear-gradient(
          135deg,
          #05050a 0%,
          #0b0715 45%,
          #080d1c 100%
        );
    }

    /* Subtle cinematic glow */
    body::before {
      content: "";
      position: fixed;
      width: 600px;
      height: 600px;
      background: rgba(139, 92, 246, 0.12);
      filter: blur(140px);
      border-radius: 50%;
      top: -250px;
      left: -200px;
      pointer-events: none;
    }

    body::after {
      content: "";
      position: fixed;
      width: 500px;
      height: 500px;
      background: rgba(59, 130, 246, 0.10);
      filter: blur(140px);
      border-radius: 50%;
      bottom: -250px;
      right: -150px;
      pointer-events: none;
    }

    .container {
      text-align: center;
      position: relative;
      z-index: 1;
      padding: 20px;
    }

    h1 {
      font-size: clamp(42px, 7vw, 78px);
      font-weight: 700;
      letter-spacing: -3px;
      margin-bottom: 14px;

      background: linear-gradient(
        90deg,
        #ffffff,
        #c4b5fd,
        #60a5fa
      );

      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    p {
      font-size: clamp(18px, 2.5vw, 25px);
      color: rgba(255, 255, 255, 0.65);
      letter-spacing: 1px;
      font-weight: 400;
    }
  </style>
</head>

<body>

  <main class="container">
    <h1>We're under development</h1>
    <p>Coming soon</p>
  </main>

</body>
</html>
